<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的PDF阅读助手</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        textarea {
            width: 100%;
            height: 60px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }
        .answer {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .sources {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .source-item {
            padding: 8px;
            border-left: 3px solid #ccc;
            margin-bottom: 5px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <h1>📚 我的 RAG 助手</h1>

    <div style="margin-bottom: 25px; padding: 15px; border: 2px dashed #aaa; border-radius: 8px;">
        <h3 style="margin-top: 0;">📤 上传文档（PDF / Markdown）</h3>
        <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt" onchange="onFileSelected()">
        <button id="uploadBtn" onclick="uploadFile()" disabled style="margin-left: 10px;">上传并向量化</button>
        <div id="uploadStatus" style="margin-top: 10px; font-size: 14px;"></div>
    </div>

    <hr>

    <h3>❓ 提问</h3>
    <textarea id="query" placeholder="输入你的问题"></textarea>
    <br>
    <button onclick="askQuestion()">提问</button>

    <div id="answer" class="answer" style="display:none;"></div>
    <div id="sources" class="sources" style="display:none;"></div>

    <script>
        let selectedFile = null;

        function onFileSelected() {
            const input = document.getElementById('fileInput');
            selectedFile = input.files[0] || null;
            document.getElementById('uploadBtn').disabled = !selectedFile;
        }

        async function uploadFile() {
            if (!selectedFile) return;
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');
            status.textContent = '⏳ 上传中，请稍候...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    status.textContent = '✅ ' + data.message;
                    status.style.color = 'green';
                } else {
                    status.textContent = '❌ ' + data.message;
                    status.style.color = 'red';
                }
            } catch (err) {
                status.textContent = '❌ 请求失败: ' + err.message;
                status.style.color = 'red';
            } finally {
                btn.disabled = false;
                selectedFile = null;
                document.getElementById('fileInput').value = '';
            }
        }

        async function askQuestion() {
            const query = document.getElementById('query').value.trim();
            if (!query) {
                alert('请输入问题');
                return;
            }

            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query, top_k: 10 })
            });

            const data = await response.json();

            const answerDiv = document.getElementById('answer');
            answerDiv.style.display = 'block';
            answerDiv.textContent = data.answer;

            const sourcesDiv = document.getElementById('sources');
            sourcesDiv.style.display = 'block';
            sourcesDiv.innerHTML = '<h3>引用来源：</h3>';
            data.sources.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'source-item';
                item.textContent = `[${i + 1}] ${s}`;
                sourcesDiv.appendChild(item);
            });
        }
    </script>
</body>
</html>
